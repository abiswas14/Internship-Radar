# Only verified sources are enabled. Unsupported entries intentionally have null URLs:
# a URL is added only after its official careers experience is investigated live.

x-critical: &critical
  enabled: false
  priority: critical
  careers_url: null
  source_mechanism: unverified
  polling_interval_seconds: 120
  jitter_seconds: 15
  scraper: null
  status: unsupported
  notes: Awaiting official-source investigation.

x-high: &high
  enabled: false
  priority: high
  careers_url: null
  source_mechanism: unverified
  polling_interval_seconds: 180
  jitter_seconds: 20
  scraper: null
  status: unsupported
  notes: Awaiting official-source investigation.

x-quant: &quant
  enabled: false
  priority: quant
  careers_url: null
  source_mechanism: unverified
  polling_interval_seconds: 240
  jitter_seconds: 30
  scraper: null
  status: unsupported
  notes: Awaiting official-source investigation.

